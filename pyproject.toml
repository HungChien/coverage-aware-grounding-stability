[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-aware-grounding-stability"
version = "1.1.0"
description = "A finite-probe, coverage-aware benchmark for candidate-order stability in vision-language grounding."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yukun Shi" }]
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy",
  "scipy",
  "Pillow"
]

[project.scripts]
cags = "coverage_aware_grounding_stability.cli:main"

[project.optional-dependencies]
models = [
  "pandas",
  "matplotlib",
  "torch",
  "torchvision",
  "transformers",
  "datasets",
  "ultralytics"
]
analysis = ["pandas", "matplotlib"]
dev = ["pandas", "matplotlib", "pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
